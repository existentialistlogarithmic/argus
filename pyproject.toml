[project]
name = "argus"
version = "0.1.0"
description = "Ontology-driven entity resolution, link analysis, and investigation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# Only needed to route natural-language translation through Claude; the engine
# and the full test suite run without it.
llm = ["anthropic>=0.40"]

[project.scripts]
argus = "argus.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["argus"]

[tool.setuptools.package-data]
argus = ["../ontology/*.json"]
